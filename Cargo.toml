[workspace]
resolver = "2"
members = ["crates/bagel-core", "crates/bagel-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Smaller, faster release builds of the desktop app.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
