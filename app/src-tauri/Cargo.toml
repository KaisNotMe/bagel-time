[package]
name = "bagel-time"
version = "0.1.0"
description = "Bagel Time Minecraft launcher"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "bagel_time_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bagel-core = { path = "../../crates/bagel-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros"] }
uuid = { version = "1.27.0", features = ["serde"] }
