[package]
name = "bagel-core"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", features = ["form", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.27.0", features = ["serde"] }
zip = "8.6.0"

[dev-dependencies]
tempfile = "3.27.0"
